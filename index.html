<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hair Salon LP</title>

<style>
body {
  margin: 0;
  font-family: "Helvetica Neue", sans-serif;
  color: #222;
  background: #fff;
}

/* セクション共通 */
section {
  padding: 70px 20px;
  max-width: 900px;
  margin: 0 auto;
}

/* 見出し */
h2 {
  font-size: 22px;
  text-align: center;
  margin-bottom: 30px;
  letter-spacing: 1px;
}

/* ファーストビュー */
.hero {
  height: 100vh;
  background: url('hero.jpg') center/cover no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: #fff;
  flex-direction: column;
  position: relative;
}

.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.4);
}

.hero-content {
  position: relative;
  z-index: 2;
}

.hero h1 {
  font-size: 34px;
  margin-bottom: 10px;
}

.hero p {
  font-size: 16px;
  opacity: 0.9;
}

/* ボタン */
.btn {
  display: inline-block;
  margin-top: 20px;
  padding: 14px 26px;
  background: #111;
  color: #fff;
  text-decoration: none;
  border-radius: 30px;
  font-size: 14px;
}

/* カード */
.card {
  background: #f7f7f7;
  padding: 18px;
  border-radius: 10px;
  margin-bottom: 12px;
}

/* ビフォーアフター */
.ba {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.ba img {
  width: 100%;
  border-radius: 10px;
}

/* 口コミ */
.review {
  background: #fff;
  border: 1px solid #eee;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 10px;
}

/* CTA固定風 */
.cta {
  text-align: center;
  background: #111;
  color: #fff;
  padding: 50px 20px;
}

.cta a {
  background: #fff;
  color: #111;
}
</style>
</head>

<body>

<!-- HERO -->
<section class="hero">
  <div class="hero-content">
    <h1>乾かすだけで決まるショート</h1>
    <p>骨格補正×再現性カット専門</p>
    <a href="#reserve" class="btn">今すぐ予約</a>
  </div>
</section>

<!-- PROBLEM -->
<section>
  <h2>こんなお悩みありませんか？</h2>
  <div class="card">朝セットがうまくいかない</div>
  <div class="card">ショートが似合わない気がする</div>
  <div class="card">美容室帰りだけ綺麗</div>
</section>

<!-- SOLUTION -->
<section>
  <h2>その悩みは設計で変わります</h2>
  <p style="text-align:center;">
    髪質ではなく「骨格」と「生えグセ」から逆算します
  </p>
</section>

<!-- BEFORE AFTER -->
<section>
  <h2>実績</h2>
  <div class="ba">
    <img src="before.jpg">
    <img src="after.jpg">
  </div>
</section>

<!-- TECH -->
<section>
  <h2>技術の特徴</h2>
  <div class="card">乾かすだけで形になる設計カット</div>
  <div class="card">襟足・丸みのコントロール</div>
  <div class="card">再現性重視のセクション設計</div>
</section>

<!-- REVIEWS -->
<section>
  <h2>お客様の声</h2>
  <div class="review">毎朝が楽になりました</div>
  <div class="review">周りに褒められるようになった</div>
</section>

<!-- ACCESS -->
<section>
  <h2>店舗情報</h2>
  <p style="text-align:center;">
    営業時間 / 住所 / アクセス
  </p>
</section>

<!-- CTA -->
<section class="cta" id="reserve">
  <h2>ご予約はこちら</h2>
  <a href="#" class="btn">LINEで予約</a>
</section>

</body>
</html>
