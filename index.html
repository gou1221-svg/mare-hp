<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salon LP</title>

<style>
body {
  margin: 0;
  font-family: "Hiragino Kaku Gothic ProN", sans-serif;
  color: #111;
  background: #fff;
}

/* 全体の空気感 */
section {
  padding: 80px 18px;
}

/* 見出しの圧 */
h2 {
  text-align: center;
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 30px;
  letter-spacing: 1px;
}

/* HERO（全面画像＋文字重ね） */
.hero {
  height: 100vh;
  background: url('hero.jpg') center/cover no-repeat;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: #fff;
}

.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.45);
}

.hero-inner {
  position: relative;
  z-index: 2;
}

.hero h1 {
  font-size: 30px;
  font-weight: 700;
  margin: 0 0 10px;
}

.hero p {
  font-size: 14px;
  opacity: 0.9;
}

/* CTAボタン（丸くて強い） */
.btn {
  margin-top: 18px;
  display: inline-block;
  background: #fff;
  color: #111;
  padding: 14px 28px;
  border-radius: 50px;
  font-weight: 600;
  text-decoration: none;
}

/* セクションのトーン切替 */
.gray {
  background: #f6f6f6;
}

/* カードではなく“行” */
.list {
  max-width: 720px;
  margin: 0 auto;
}

.item {
  padding: 18px 0;
  border-bottom: 1px solid #eaeaea;
  font-size: 15px;
}

/* ビフォーアフター（全面寄せ） */
.ba {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}

.ba img {
  width: 100%;
  height: 240px;
  object-fit: cover;
}

/* 口コミ（リアル感） */
.review {
  max-width: 720px;
  margin: 0 auto 12px;
  padding: 16px;
  border-left: 3px solid #111;
  background: #fafafa;
  font-size: 14px;
}

/* CTA帯（黒で締める） */
.cta {
  background: #111;
  color: #fff;
  text-align: center;
}

.cta a {
  background: #fff;
  color: #111;
}
</style>
</head>

<body>

<!-- HERO -->
<section class="hero">
  <div class="hero-inner">
    <h1>乾かすだけで決まるショート</h1>
    <p>再現性重視のデザインカット</p>
    <a class="btn" href="#reserve">予約する</a>
  </div>
</section>

<!-- PROBLEM -->
<section>
  <h2>こんな悩みありませんか？</h2>
  <div class="list">
    <div class="item">朝セットしても崩れる</div>
    <div class="item">美容室帰りだけ綺麗</div>
    <div class="item">ショートがしっくりこない</div>
  </div>
</section>

<!-- SOLUTION -->
<section class="gray">
  <h2>解決の考え方</h2>
  <div class="list">
    <div class="item">骨格から逆算してカット設計</div>
    <div class="item">乾かすだけで形になる構造</div>
    <div class="item">再現性を最優先にした設計思想</div>
  </div>
</section>

<!-- BEFORE AFTER -->
<section>
  <h2>実例</h2>
  <div class="ba">
    <img src="before.jpg">
    <img src="after.jpg">
  </div>
</section>

<!-- REVIEWS -->
<section class="gray">
  <h2>お客様の声</h2>
  <div class="review">朝が圧倒的に楽になった</div>
  <div class="review">周りから褒められるようになった</div>
  <div class="review">スタイリングが不要になった</div>
</section>

<!-- CTA -->
<section class="cta" id="reserve">
  <h2>ご予約</h2>
  <a class="btn" href="#">LINEで予約</a>
</section>

</body>
</html>
